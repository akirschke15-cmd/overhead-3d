<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overhead 3D — Reston, VA</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>

  <header class="hud hud-header">
    <div class="title"><span class="plane-icon">✈</span> Overhead <span class="badge">3D</span></div>
    <div class="subtitle" id="hud-subtitle">50 mi around Arlington, VA (22206) · airborne only</div>
  </header>

  <aside class="hud hud-legend">
    <div class="row"><span class="dot level"></span> Level</div>
    <div class="row"><span class="dot climb"></span> Climbing <span class="arrow">↑</span></div>
    <div class="row"><span class="dot descend"></span> Descending <span class="arrow">↓</span></div>
  </aside>

  <section class="hud hud-clock">
    <div id="hud-time" class="time">10:57:00 AM</div>
    <div id="hud-sub" class="sub">Thu, Jul 30 · — aircraft · 60× speed</div>
    <div class="controls-row">
      <button id="btn-pause" class="btn">⏸ Pause</button>
      <button class="btn speed" data-speed="15">15×</button>
      <button class="btn speed" data-speed="60">60×</button>
      <button class="btn speed" data-speed="240">240×</button>
      <button id="btn-mode" class="btn mode">⇡ Go Live</button>
      <button id="btn-tags" class="btn tags active">✈ Tags</button>
      <button id="btn-record" class="btn">● Record</button>
      <a class="btn" href="ceiling.html" title="Ceiling projector mode">⌂ Ceiling</a>
    </div>
  </section>

  <footer class="hud-credits">
    <div>Simulated traffic · 3D recreation · ADS-B style data</div>
    <div class="hint">drag orbit · scroll zoom · 1/2/3 views · space pause · L live · F tags · R record</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
